<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>뽀득뽀득</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrites, so a deep link like
      // /bbodeuk-bbodeuk/login lands here on refresh. Re-encode it into a
      // query string and redirect to index.html, which decodes it back
      // (see the matching script in index.html). Keep in sync with
      // vite.config.ts's `base`.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
