    <meta charset="UTF-8" />

      name="viewport"

    />
    <title>뽀득뽀득</title>
    <meta name="description" content="한 곳만 칠해도, 오늘 청소는 성공. 공간별 청소 기록 서비스 뽀득뽀득" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="뽀득뽀득" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/bbodeuk_icon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // Decodes the query-string redirect that public/404.html produces for
      // deep links on GitHub Pages, restoring the original clean path.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (segment) {
              return segment.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
